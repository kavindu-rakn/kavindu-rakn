# Generates the contribution-grid snake animation referenced in section 04 of
# README.md. Writes snake.svg (light) and snake-dark.svg (dark) to the `output`
# branch, which the README loads via raw.githubusercontent.com.
#
# Run it once by hand after pushing: Actions -> snake -> Run workflow.
# Until it has run at least once the `output` branch does not exist and the
# README's snake image renders as a broken image.

name: snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
