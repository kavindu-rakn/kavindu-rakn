# Generates the contribution-grid snake animation in README.md.
#
# snk fetches the contribution calendar and draws the grid; respin-snake.mjs
# then replaces its animation with a slower, self-avoiding, growing snake and a
# centre-out progress bar (snk exposes no options for any of that).
#
# Writes snake.svg (light) and snake-dark.svg (dark) to the `output` branch,
# which the README loads via raw.githubusercontent.com.
#
# Run it once by hand after pushing: Actions -> snake -> Run workflow.
# Until it has run at least once the `output` branch does not exist and the
# README's snake image renders as a broken image.

name: snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # snk runs as root in Docker, so everything in dist/ is root-owned and a
      # normal step cannot write over it. Read from dist/, write to out/.
      - name: Re-spin the animation
        env:
          SNAKE_STEP_MS: "150" # ms per cell; snk's own pace is ~100
          SNAKE_INITIAL_LENGTH: "4"
          SNAKE_GROWTH_INTERVAL: "18" # +1 segment per 18 contributions eaten
        run: |
          ls -la dist
          node scripts/respin-snake.mjs dist/snake.svg      --out=out/snake.svg
          node scripts/respin-snake.mjs dist/snake-dark.svg --out=out/snake-dark.svg
          ls -la out

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
