name: CI Check Gate

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Typecheck, Build & Content Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'portfolio/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro typecheck
        run: npm run check

      - name: Build site & lint content
        run: npm run build

      - name: Ship readiness report (advisory)
        continue-on-error: true
        run: node scripts/lint-content.mjs --strict
